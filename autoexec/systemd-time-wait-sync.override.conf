# Drop-in for systemd-time-wait-sync.service.
#
# Installed by install-systemd.sh into:
#   /etc/systemd/system/systemd-time-wait-sync.service.d/override.conf
#
# Why: co2-logger.service orders itself After=time-sync.target so it starts
# with an already-synced clock when possible (see co2-logger.service for the
# full rationale: Pi 5 without RTC, clock behind after a blackout reboot).
# But upstream systemd-time-wait-sync.service ships with
# TimeoutStartSec=infinity: on a station with no network at boot, NTP never
# arrives and this unit would wait forever, hanging sysinit.target (and
# therefore the WHOLE boot, not just co2-logger). This override bounds the
# wait so the system always finishes booting.
#
# 90 s is generous for a normal LAN/Wi-Fi handshake + NTP round trip; if it
# is not reached, the boot continues with the clock still wrong and
# co2-logger starts anyway. Data integrity in that case relies on Fix B in
# gmp343_sht31_logger.py (_last_written_minute: never rewrite a minute
# already on disk), NOT on this unit.
[Service]
TimeoutStartSec=90
